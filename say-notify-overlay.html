<!doctype html><html><head><meta charset="utf-8"><style>
  :root{ --amber:#ffcf6b; --teal:#5fe0d6; }
  html,body{margin:0;background:transparent;overflow:hidden;
    font-family:"Courier New",monospace;-webkit-user-select:none;}
  /* whole card fades in, holds, fades out (JS sets --hold) */
  #card{position:fixed;left:14px;bottom:14px;width:300px;
    border:2px solid var(--teal);border-radius:6px;background:#06100f;
    box-shadow:0 0 18px rgba(95,224,214,.55),inset 0 0 24px rgba(0,0,0,.8);
    animation:appear .35s ease-out, glow 2.2s ease-in-out infinite;
    opacity:1;}  /* visible by default — don't depend on animation running */
  @keyframes appear{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes glow{0%,100%{box-shadow:0 0 14px rgba(95,224,214,.4),inset 0 0 24px rgba(0,0,0,.8)}
                  50%{box-shadow:0 0 26px rgba(95,224,214,.85),inset 0 0 24px rgba(0,0,0,.8)}}
  #hdr{display:flex;align-items:center;gap:7px;padding:5px 9px;
    color:var(--teal);font-size:11px;letter-spacing:1.5px;
    background:linear-gradient(90deg,rgba(95,224,214,.18),transparent);
    border-bottom:1px solid rgba(95,224,214,.35);text-transform:uppercase;}
  #dot{width:8px;height:8px;border-radius:50%;background:#ff5b4d;
    box-shadow:0 0 8px #ff5b4d;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:.15}}
  #pic{position:relative;height:300px;overflow:hidden;}
  #pic img{width:100%;height:100%;object-fit:cover;display:block;
    filter:contrast(1.15) saturate(1.15) brightness(1.02);
    animation:bob 4.5s ease-in-out infinite, flick 5s steps(2) infinite;}
  @keyframes bob{0%,100%{transform:scale(1.04) translateY(0)}50%{transform:scale(1.06) translateY(-4px)}}
  @keyframes flick{0%,97%{opacity:1}98%{opacity:.86}99%{opacity:1}}
  /* CRT scanlines + rolling bar */
  #pic::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px);}
  #pic::after{content:"";position:absolute;left:0;right:0;height:38px;pointer-events:none;
    background:linear-gradient(rgba(255,255,255,.06),transparent);
    animation:roll 3.2s linear infinite;}
  @keyframes roll{from{top:-40px}to{top:300px}}
  #msg{padding:7px 10px 9px;color:var(--amber);font-size:13px;line-height:1.3;
    text-shadow:0 0 6px rgba(255,207,107,.6);border-top:1px solid rgba(255,207,107,.25);
    min-height:18px;}
  #cur{animation:blink 1s steps(1) infinite;}
</style></head><body>
  <div id="card">
    <div id="hdr"><span id="dot"></span>&nbsp;Incoming Transmission</div>
    <div id="pic"><img src="__IMG__"></div>
    <div id="msg">__MSG__<span id="cur">&#9608;</span></div>
  </div>
</body></html>
